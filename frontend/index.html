<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>aag-studio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="home">
    <h2>aag-studio</h2>
    <p>A tool for building resource access graphs (RAGs): diagrams of how accounts, devices and credentials give access to each other.</p>
    <h3>Your graphs</h3>
    <ul id="graph-list"></ul>
    <input id="new-graph-name" placeholder="name for a new graph">
    <button id="new-graph-btn">Create and open</button>
  </div>

  <div id="editor" hidden>
    <div id="top-left-bar" class="floating-island">
      <button id="btn-hamburger" title="Menu"><i class="mdi mdi-menu"></i></button>
      <span id="graph-name"></span>
    </div>

    <div id="hamburger-menu" class="floating-menu" hidden>
      <button id="menu-home"><i class="mdi mdi-home"></i> Home</button>
      <button id="menu-rename"><i class="mdi mdi-pencil-outline"></i> Rename graph</button>
      <button id="menu-issues"><i class="mdi mdi-alert-circle-outline"></i> Issues <span id="issues-count"></span></button>
      <div id="menu-meta" class="menu-footer"></div>
    </div>

    <div id="tool-island" class="floating-island">
      <button id="tool-pan" class="active" title="Pan (H or hold Space)"><i class="mdi mdi-hand-back-right"></i></button>
      <button id="tool-select" title="Select (V)"><i class="mdi mdi-cursor-default"></i></button>
      <span class="island-divider"></span>
      <button id="tool-add-vertex" title="Add vertex"><i class="mdi mdi-plus-box-outline"></i> Add vertex</button>
      <button id="tool-add-edge" title="Add edge"><i class="mdi mdi-vector-line"></i> Add edge</button>
    </div>

    <div id="top-right-island" class="floating-island">
      <button id="btn-undo" title="Undo (Cmd+Z)"><i class="mdi mdi-undo"></i></button>
      <button id="btn-redo" title="Redo (Cmd+Y)"><i class="mdi mdi-redo"></i></button>
      <span class="island-divider"></span>
      <button id="btn-zoom-out" title="Zoom out"><i class="mdi mdi-minus"></i></button>
      <button id="btn-zoom-reset" title="Reset zoom">100%</button>
      <button id="btn-zoom-in" title="Zoom in"><i class="mdi mdi-plus"></i></button>
    </div>

    <div id="palette-island" class="floating-island left-island" hidden>
      <div class="island-header">
        <strong>Add vertex</strong>
        <button id="palette-close"><i class="mdi mdi-close"></i></button>
      </div>
      <div id="palette-tree"></div>
    </div>

    <div id="edge-island" class="floating-island left-island" hidden>
      <div class="island-header">
        <strong>Add edge</strong>
        <button id="edge-close"><i class="mdi mdi-close"></i></button>
      </div>
      <div class="island-body">
        <div class="island-section-title">Style</div>
        <div class="island-btn-group">
          <button id="style-bezier" class="island-group-btn active" type="button" title="Curved"><i class="mdi mdi-vector-curve"></i></button>
          <button id="style-taxi" class="island-group-btn" type="button" title="Elbow"><i class="mdi mdi-vector-polyline"></i></button>
          <button id="style-straight" class="island-group-btn" type="button" title="Straight"><i class="mdi mdi-vector-line"></i></button>
        </div>

        <div class="island-section-title">Type</div>
        <div class="island-btn-group">
          <button id="type-ha" class="island-group-btn active" type="button">HA</button>
          <button id="type-ga" class="island-group-btn" type="button">GA</button>
        </div>

        <div class="island-section-title">Time</div>
        <div class="island-time-row">
          <input id="edge-time-from" class="island-time-input" type="text" value="inf">
          <span>to</span>
          <input id="edge-time-until" class="island-time-input" type="text" value="inf">
        </div>
      </div>
    </div>

    <div id="item-island" class="floating-island left-island" hidden>
      <div class="island-header">
        <strong id="item-island-title">Edit</strong>
        <div class="island-header-actions">
          <button id="item-island-duplicate" title="Duplicate (Cmd+D)"><i class="mdi mdi-content-copy"></i></button>
          <button id="item-island-delete" title="Delete (Backspace)"><i class="mdi mdi-delete-outline"></i></button>
          <button id="item-island-close"><i class="mdi mdi-close"></i></button>
        </div>
      </div>
      <div id="item-island-body" class="island-body"></div>
    </div>

    <div id="issues-dialog" class="floating-island right-dialog" hidden>
      <div class="island-header">
        <strong>Issues</strong>
        <button id="issues-close"><i class="mdi mdi-close"></i></button>
      </div>
      <ul id="violations-list"></ul>
    </div>

    <div id="graph"></div>
    <svg id="edge-preview-svg" class="edge-preview-layer">
      <defs>
        <marker id="edge-preview-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f6fed" />
        </marker>
      </defs>
      <path id="edge-preview-path" d="" stroke="#2f6fed" stroke-width="2.5" fill="none" marker-end="url(#edge-preview-arrow)" hidden />
    </svg>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div id="modal-box" class="modal-box">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-message" class="modal-message"></div>
      <input id="modal-input" class="modal-input" hidden>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="modal-btn secondary">Cancel</button>
        <button id="modal-confirm-btn" class="modal-btn primary">OK</button>
      </div>
    </div>
  </div>

  <script src="/vendor/lodash.min.js"></script>
  <script src="/vendor/cytoscape.min.js"></script>
  <script src="/vendor/cytoscape-edgehandles.min.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
