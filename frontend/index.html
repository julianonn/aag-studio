<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>aag-studio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="library">
    <h2>aag-studio</h2>
    <p>A tool for building resource access graphs (RAGs): diagrams of how accounts, devices and credentials give access to each other.</p>
    <h3>Your graphs</h3>
    <ul id="graph-list"></ul>
    <input id="new-graph-name" placeholder="name for a new graph">
    <button id="new-graph-btn">Create and open</button>
  </div>

  <div id="editor" hidden>
    <div id="icon-strip">
      <button id="back-to-library"><span class="icon-label">Home</span></button>
      <button id="icon-add"><span class="icon-label">Add vertex</span></button>
      <button id="icon-issues"><span id="issues-count"></span><span class="icon-label">Issues</span></button>
      <button id="icon-info"><span class="icon-label">Graph info</span></button>
    </div>

    <div id="side-panel" hidden>
      <div id="panel-header">
        <strong id="panel-title"></strong>
        <button id="panel-collapse" title="Collapse panel"></button>
      </div>
      <div id="panel-add" hidden></div>
      <div id="panel-issues" hidden>
        <ul id="violations-list"></ul>
      </div>
      <div id="panel-info" hidden>
        <div><strong id="graph-name"></strong></div>
        <button id="rename-graph">rename</button>
        <div id="graph-meta"></div>
      </div>
    </div>

    <div id="graph"></div>
  </div>

  <script src="/vendor/lodash.min.js"></script>
  <script src="/vendor/cytoscape.min.js"></script>
  <script src="/vendor/cytoscape-edgehandles.min.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
