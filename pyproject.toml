[project]
name = "aag-studio"
version = "0.1.0"
description = "account/resource access graph studio for research"
authors = [
    { name = "julia", email = "95244239+julianonn@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
aag-studio = "aag_studio:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
